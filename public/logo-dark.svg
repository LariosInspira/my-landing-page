<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 110" width="320" height="110" fill="none">
  <defs>
    <linearGradient id="goldGradDark" x1="40" y1="10" x2="280" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C9982E" />
      <stop offset="35%" stop-color="#E2B74F" />
      <stop offset="70%" stop-color="#D4A338" />
      <stop offset="100%" stop-color="#B68521" />
    </linearGradient>
    <linearGradient id="heartGradDark" x1="160" y1="5" x2="160" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E25A36" />
      <stop offset="100%" stop-color="#BA3E1E" />
    </linearGradient>
  </defs>

  <!-- INFINITY SYMBOL & HEART -->
  <g id="infinity-dark">
    <!-- Gold Ribbon Loop -->
    <path
      d="M 160,26 
         C 176,11 202,3 226,3 
         C 256,3 277,15 277,29 
         C 277,43 255,52 225,52 
         C 197,52 173,40 160,26 
         C 147,40 123,52 95,52 
         C 65,52 43,43 43,29 
         C 43,15 64,3 94,3 
         C 118,3 144,11 160,26 Z"
      fill="none"
      stroke="url(#goldGradDark)"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Forest Green Intertwined Ribbon -->
    <path
      d="M 160,26 
         C 146,38 124,49 97,49 
         C 70,49 50,40 50,29 
         C 50,18 69,8 96,8 
         C 118,8 142,16 160,26 
         C 178,36 202,48 224,48 
         C 251,48 270,39 270,29 
         C 270,20 254,10 230,8"
      fill="none"
      stroke="#2E7E5A"
      stroke-width="4.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Fine Gold Thread -->
    <path
      d="M 160,26 
         C 174,14 198,6 225,6 
         C 250,6 268,16 268,27 
         C 268,38 248,46 223,46"
      fill="none"
      stroke="#F3CE79"
      stroke-width="1.2"
      stroke-linecap="round"
      opacity="0.85"
    />

    <!-- Vibrant Terracotta/Orange Heart -->
    <g transform="translate(160, 14)">
      <path
        d="M 0, 7 
           C -1, 5 -8, -1 -8, -6 
           C -8, -10 -4, -13 0, -8 
           C 4, -13 8, -10 8, -6 
           C 8, -1 1, 5 0, 7 Z"
        fill="url(#heartGradDark)"
        stroke="#A53114"
        stroke-width="0.5"
      />
    </g>
  </g>

  <!-- SARAH LARIOS -->
  <text
    x="160"
    y="84"
    text-anchor="middle"
    fill="#FAF8F5"
    font-family="'Cormorant Garamond', Georgia, serif"
    font-size="33"
    font-weight="700"
    letter-spacing="4"
  >
    SARAH LARIOS
  </text>

  <!-- Arquitecta del Climaterio -->
  <g transform="translate(160, 102)">
    <text
      text-anchor="middle"
      font-family="'Plus Jakarta Sans', system-ui, sans-serif"
      font-size="12.5"
      font-weight="500"
      letter-spacing="0.8"
    >
      <tspan fill="#C3E5D4">Arquitecta del </tspan>
      <tspan fill="#E5BA5A" font-weight="600">Climaterio</tspan>
    </text>
  </g>
</svg>
